[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Public client-side values are intentionally referenced in source/build output;
  # omit them from secrets scanning so Netlify does not block the deploy.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_RAZORPAY_KEY_ID,NODE_VERSION"
  # Scripts only reference secret env var names; omit paths to avoid false positives.
  SECRETS_SCAN_OMIT_PATHS = "scripts/setup-firestore.mjs,scripts/deploy-firestore-rules.mjs,scripts/creator-payouts.mjs"

# Required runtime env vars (set in Netlify dashboard):
# - GITHUB_TOKEN: GitHub PAT with `repo` scope, used to proxy private release assets
